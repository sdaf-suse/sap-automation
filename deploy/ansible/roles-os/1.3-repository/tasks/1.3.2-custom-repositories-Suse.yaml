# /*----------------------------------------------------------------------------8
# |                       Custom repositories                                   |
# +------------------------------------4---------------------------------------*/

# Analyse the repo list for this distribution selecting only those
# packages assigned to the active tier or 'all'.
- name:                                "1.3.2 Custom Repository - SUSE - Determine custom repos appropriate for tier {{ distribution_full_id }}"
  ansible.builtin.set_fact:
    custom_repos_for_tier:             "{{ custom_repos[distribution_full_id] |
                                             selectattr('tier', 'in', ['all', tier]) |
                                             list }}"
  when:                                custom_repos[distribution_full_id] is defined

  # Add repositories
- name:                                "1.3.2 Custom Repository - SUSE - Add the custom repositories {{ ansible_os_family }}"
  community.general.zypper_repository:
    repo:                              "{{ item.url }}"
    state:                             "{{ item.state }}"
    overwrite_multiple:                true
    disable_gpg_check:                 true
    auto_import_keys:                  true
  loop:                                "{{ custom_repos_for_tier }}"
  register:                            repo_result
  when:
    - custom_repos_for_tier is defined
    - custom_repos_for_tier | length > 0

- name:                              "1.3.2 Custom Repository - SUSE - Assert all custom repositories were added successfully"
  ansible.builtin.fail:
    msg: >-
                                       The following custom repositories failed to add:
                                       {{ repo_result.results
                                          | selectattr('failed', 'equalto', true)
                                          | map(attribute='item.repo')
                                          | list }}
  when:
    - custom_repos_for_tier is defined
    - custom_repos_for_tier | length > 0
    - repo_result is defined
    - repo_result.results | selectattr('failed', 'equalto', true) | list | length > 0
