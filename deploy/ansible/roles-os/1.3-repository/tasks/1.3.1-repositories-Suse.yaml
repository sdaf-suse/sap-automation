- name:                                "1.3.1 Repository - SUSE - Import repo list"
  ansible.builtin.include_vars:        repos.yaml

# Analyse the repo list for this distribution selecting only those
# packages assigned to the active tier or 'all'.
- name:                                "1.3.1 Repository - SUSE - Determine repos appropriate for tier {{ distribution_full_id }}"
  ansible.builtin.set_fact:
    repos_for_tier:                    "{{ repos[distribution_full_id] |
                                             selectattr('tier', 'in', ['all', tier]) |
                                             list }}"

# Print list of matching repos if verbosity it 1 or greater
- name:                                "1.3.1 Repository - SUSE - Print matching repos"
  ansible.builtin.debug:
    var:                               repos_for_tier
    verbosity:                         2
  when:
                                       - repos_for_tier is defined
                                       - repos_for_tier | length > 0

# Add repositories
- name:                                "1.3.1 Repository - SUSE - Add the repositories {{ ansible_os_family }}"
  community.general.zypper_repository:
    name:                              "{{ item.repo }}"
    repo:                              "{{ item.url }}"
    state:                             "{{ item.state }}"
    overwrite_multiple:                true
    disable_gpg_check:                 true
    auto_import_keys:                  true
  loop:                                "{{ repos_for_tier }}"
  register:                            repo_result
  when:
    - repos_for_tier is defined
    - repos_for_tier | length > 0

- name:                              "1.3.1 Repository - SUSE - Assert all repositories were added successfully"
  ansible.builtin.fail:
    msg: >-
                                       The following repositories failed to add:
                                       {{ repo_result.results
                                          | selectattr('failed', 'equalto', true)
                                          | map(attribute='item.repo')
                                          | list }}
  when:
    - repos_for_tier is defined
    - repos_for_tier | length > 0
    - repo_result is defined
    - repo_result.results | selectattr('failed', 'equalto', true) | list | length > 0

- name:                                "1.3.1 Repository - SUSE - Add the repositories result"
  ansible.builtin.debug:
    msg:                               "Result from adding repository: {{ repo_result }}"
    verbosity:                         2
